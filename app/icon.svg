<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Köşeleri yumuşatılmış koyu arka plan (rx="20") -->
    <rect width="120" height="120" rx="20" fill="#0f172a"/>
    
    <!-- 'O' Harfi ve Direksiyon Çemberi -->
    <circle cx="60" cy="60" r="40" fill="none" stroke="#38bdf8" stroke-width="14"/>
    
    <!-- 'Y' Harfi ve Direksiyon Kolları -->
    <path d="M 32 32 L 60 60 L 88 32 M 60 60 L 60 100" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Yapay Zeka Çekirdeği -->
    <circle cx="60" cy="60" r="11" fill="#34d399"/>
</svg>
