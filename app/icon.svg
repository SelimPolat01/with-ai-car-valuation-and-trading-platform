<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Arka Plan (Uygulama İkonu Standardı - Köşeleri Yuvarlatılmış Kare) -->
  <rect width="512" height="512" rx="115" fill="#0B0F19"/>

  <!-- Gradient Renk Tanımlamaları -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" /> <!-- Canlı Mor (Yapay Zeka & Premium His) -->
      <stop offset="50%" stop-color="#6366F1" /> <!-- İndigo (Güven) -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Mavi (Teknoloji & Hız) -->
    </linearGradient>
  </defs>

  <!-- Yapay Zeka Işıltıları (✨) -->
  <path d="M370 120 Q390 120 390 100 Q390 120 410 120 Q390 120 390 140 Q390 120 370 120 Z" fill="#3B82F6" opacity="0.9"/>
  <path d="M120 180 Q130 180 130 170 Q130 180 140 180 Q130 180 130 190 Q130 180 120 180 Z" fill="#A855F7" opacity="0.8"/>
  <path d="M410 240 Q415 240 415 235 Q415 240 420 240 Q415 240 415 245 Q415 240 410 240 Z" fill="#6366F1" opacity="0.6"/>

  <!-- Modern Araç Silueti -->
  <g stroke="url(#brandGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Tavan Çizgisi ve Aerodinamik Hat -->
    <path d="M 100 290
             L 140 210
             C 165 175, 205 160, 245 160
             L 280 160
             C 320 160, 355 180, 385 220
             L 430 290" />
             
    <!-- Alt Gövde (Tekerlek Boşlukları) -->
    <path d="M 90 290 L 135 290" />
    <path d="M 225 290 L 305 290" />
    <path d="M 395 290 L 445 290" />

    <!-- Tekerlek Dış Hatları -->
    <circle cx="180" cy="290" r="45" />
    <circle cx="350" cy="290" r="45" />
  </g>

  <!-- Tekerlek Merkezleri (Dinamizm ve Güç) -->
  <circle cx="180" cy="290" r="16" fill="url(#brandGradient)" />
  <circle cx="350" cy="290" r="16" fill="url(#brandGradient)" />
</svg>
